
shell /usr/bin/bash

kitty_mod ctrl+shift

# BEGIN_KITTY_THEME
# Base2Tone Drawbridge Dark
include current-theme.conf
# END_KITTY_THEME

#FONTS
font_family NotoSans Nerd Font
bold_font NotoSans Nerd Font Bold
italic_font NotoSans Nerd Font Italic
bold_italic_font NotoSans Nerd Font Bold Italic

#FONTS_SIZE
font_size 11

#TRANSPARENCY
background_opacity 0.8
background_blur 1

#TABS
tab_bar_edge bottom
tab_bar_style powerline
tab_powerline_style slanted

#LAYOUT
enabled_layouts tall,*

#WINDOWS
window_margin_width 7
window_border_width 2pt
